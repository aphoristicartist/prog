name: container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - crates/prog-cli/assets/lenses/**
      - crates/prog-cli/build.rs
      - crates/prog-cli/src/commands/lenses.rs
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Minimal default permissions; the build job widens only what publishing needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up buildx
        run: docker buildx create --use
      - name: Build and smoke test the image
        run: |
          # A local docker exporter cannot load the provenance manifest list.
          # Tag builds still exercise the same Dockerfile; tag publishing below
          # retains SLSA provenance on the multi-arch GHCR manifests.
          docker buildx build --platform linux/amd64 --provenance=false --tag prog:ci --load .
          docker run --rm prog:ci --help >/dev/null
          docker run --rm prog:ci route -- git status --short | grep -q '"schema"'
          docker run --rm \
            -v "$PWD/fixtures:/work/fixtures" \
            -w /work \
            prog:ci observe --file fixtures/cli/list_items.py >/dev/null
      - name: Bundled recipe lenses and reopened evidence work in the image
        run: |
          project="$(mktemp -d)"
          trap 'sudo rm -rf "$project"' EXIT
          chmod 777 "$project"
          printf 'INFO start\nERROR installed fixture failed\n' > "$project/service.log"
          docker run --rm -v "$project:/work" -w /work \
            prog:ci recipe logs-root-cause --file service.log > "$project/recipe.json"
          cursor="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["lens"]["id"] == "logs"; assert r["findings"][0]["kind"] == "log_error"; print(r["cursor"])' "$project/recipe.json")"
          docker run --rm -v "$project:/work" -w /work \
            prog:ci inspect "$cursor" --goal 'find the root cause' > "$project/inspect.json"
          docker run --rm -v "$project:/work" -w /work \
            prog:ci evidence "$cursor" --path /lines/1 > "$project/evidence.json"
          python3 - "$project" <<'PY'
          import json, sys
          from pathlib import Path
          project = Path(sys.argv[1])
          inspected = json.loads((project / "inspect.json").read_text())
          assert any(f["kind"] == "log_error" for f in inspected["findings"])
          evidence = json.loads((project / "evidence.json").read_text())
          assert evidence["evidence_ref"]["availability"] == "recoverable"
          assert "installed fixture failed" in str(evidence["excerpt"])
          assert "could not be loaded" not in str(inspected) + str(evidence)
          assert not (project / "lenses").exists()
          PY
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Publish multi-arch tagged image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --tag "ghcr.io/aphoristicartist/prog:${GITHUB_REF_NAME}" \
            --tag "ghcr.io/aphoristicartist/prog:${version}" \
            --tag ghcr.io/aphoristicartist/prog:latest \
            --push .
