name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - name: Test native harness extension packages
        run: |
          PROG_TEST_BINARY="$PWD/target/debug/prog" npm test --prefix extensions/deepseek-harness
          npm pack --dry-run ./extensions/deepseek-harness
      - run: cargo run -p prog-cli -- --help

  macos:
    name: macos (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features

  dirty-checkout-isolation:
    # CLI tests must never observe the checkout that runs them. Keep an
    # untracked file changing at the repository root while the suite runs so
    # inherited-CWD regressions fail deterministically in CI.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Test from a dirty, changing checkout
        shell: bash
        run: |
          set -euo pipefail
          dirty_file="$GITHUB_WORKSPACE/.prog-ci-dirty-worktree"
          (
            while true; do
              printf '%s\n' "$(date +%s%N)" > "$dirty_file"
              sleep 0.01
            done
          ) &
          writer_pid=$!
          trap 'kill "$writer_pid" 2>/dev/null || true; wait "$writer_pid" 2>/dev/null || true' EXIT
          cargo test --workspace --all-targets --all-features

  msrv:
    # Verifies the rust-version pin declared in Cargo.toml actually builds and
    # tests cleanly on the declared floor, rather than being dead metadata.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - run: cargo +1.89.0 build --workspace --all-features
      - run: cargo +1.89.0 test --workspace

  version-consistency:
    # Guards against drift between Cargo.toml version, the CHANGELOG, and git
    # tags. See .github/scripts/check-version-consistency.sh for the contract.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/check-version-consistency.sh

  dependency-policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  package-policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - run: bash .github/scripts/check-package-contents.sh
