name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Minimal default permissions; per-job grants widen what each job needs.
permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo run -p prog-cli -- --help

  version-consistency:
    name: version consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/check-version-consistency.sh

  msrv:
    name: msrv
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - run: cargo +1.89.0 build --workspace --all-features
      - run: cargo +1.89.0 test --workspace

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    permissions:
      id-token: write      # required by actions/attest-build-provenance
      attestations: write  # required by actions/attest-build-provenance
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked -p prog-cli --target "${{ matrix.target }}"

      - name: Stage tarball
        run: |
          target="${{ matrix.target }}"
          echo "target=$target" >> "$GITHUB_ENV"
          staging="prog-${target}"
          mkdir -p "$staging"
          cp "target/${target}/release/prog" "$staging/"
          cp LICENSE README.md CHANGELOG.md "$staging/"
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          printf '%s\n' "$version" > "$staging/VERSION"
          printf '%s\n' "$target" > "$staging/TARGET"
          mkdir -p "$staging/docs"
          cp docs/release-notes.md "$staging/docs/"
          tar -czf "prog-${target}.tar.gz" "$staging"
          shasum -a 256 "prog-${target}.tar.gz" > "SHA256SUMS-${target}"
          echo "::group::tarball contents"; tar -tzf "prog-${target}.tar.gz"; echo "::endgroup::"
          echo "::group::checksum"; cat "SHA256SUMS-${target}"; echo "::endgroup::"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prog-${{ env.target }}
          path: |
            prog-${{ env.target }}.tar.gz
            SHA256SUMS-${{ env.target }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            prog-${{ env.target }}.tar.gz
            SHA256SUMS-${{ env.target }}

  sbom:
    name: sbom (cyclonedx)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate SBOM
        # cargo-cyclonedx 0.5.9 discovers every workspace member through the
        # root Cargo.toml and writes <crate>.cdx.json beside each manifest.
        run: cargo cyclonedx --format json

      - name: Collect SBOM files
        run: |
          mkdir -p sbom
          # cargo-cyclonedx writes <crate>.cdx.json next to each Cargo.toml.
          find . -name '*.cdx.json' -exec cp {} sbom/ \;
          ls -la sbom/

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.cdx.json

  cargo-package-dryrun:
    name: cargo package (dry-run leak check)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Verify exact crate package contents
        run: bash .github/scripts/check-package-contents.sh

  installer:
    name: verified curl installer
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate installer syntax
        run: sh -n install.sh
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: install.sh
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: install.sh

  rc-smoke:
    name: rc smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Resolve target triple
        run: |
          target="${{ matrix.target }}"
          echo "target=$target" >> "$GITHUB_ENV"

      - name: Download matching build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prog-${{ env.target }}

      - name: Install verified release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "SHA256SUMS-${{ env.target }}" SHA256SUMS
          install_dir="$PWD/installed"
          PROG_RELEASE_URL="file://$PWD" \
          PROG_ALLOW_FILE_URL=1 \
          PROG_TARGET="${{ env.target }}" \
          PROG_INSTALL_DIR="$install_dir" \
            sh install.sh
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Artifact provenance matches the release candidate
        run: |
          expected_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test "$(prog --version | awk '{print $2}')" = "$expected_version"
          grep -Fx "target=${{ env.target }}" installed/.prog-install

      - name: prog --help exits 0
        run: prog --help

      - name: Bounded observation produces a non-null cursor
        run: |
          rm -rf /tmp/prog-rc-smoke
          prog --dir /tmp/prog-rc-smoke source add-cli demo_cli \
            --operation list --read-only -- \
            python3 fixtures/cli/list_items.py
          result="$(prog --dir /tmp/prog-rc-smoke call demo_cli list --args '{}')"
          cursor="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cursor"])')"
          test -n "$cursor"
          echo "cursor=${cursor}"
          # Persist the cursor for the reopen step via GITHUB_ENV.
          echo "cursor=${cursor}" >> "$GITHUB_ENV"

      - name: Store reopens and inspect succeeds after process exit
        run: |
          # A fresh process reads the cursor from the local store, proving the
          # on-disk cache reopens across invocations.
          prog --dir /tmp/prog-rc-smoke inspect "${cursor}" --goal "find important evidence"

  release:
    name: publish github release
    runs-on: ubuntu-22.04
    needs: [quality, version-consistency, msrv, dependency-policy, build, sbom, cargo-package-dryrun, installer, rc-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # required to create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Assemble release bundle
        run: |
          mkdir -p release/sbom
          # Collect the per-platform tarballs and SBOM files.
          find dist -name '*.tar.gz' -exec cp {} release/ \;
          find dist -name '*.cdx.json' -exec cp {} release/sbom/ \;
          find dist -name 'install.sh' -exec cp {} release/ \;
          # Recompute SHA256SUMS over the tarballs we actually ship, so the file
          # is self-consistent regardless of where it was assembled. The per-
          # target checksums produced in the build jobs are attested separately
          # and serve as a cross-check; this combined file is what users verify.
          (cd release && shasum -a 256 *.tar.gz install.sh > SHA256SUMS)
          echo "::group::release contents"; ls -laR release; echo "::endgroup::"
          echo "::group::SHA256SUMS"; cat release/SHA256SUMS; echo "::endgroup::"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/*.tar.gz
            release/install.sh
            release/SHA256SUMS
            release/sbom/*.cdx.json
          body: |
            ## Release artifacts

            Prebuilt binaries for Ubuntu 22.04+ (x86_64) and macOS 15+
            (Apple Silicon and Intel) are attached as tarballs, alongside a
            combined `SHA256SUMS` and CycloneDX SBOM files.

            ### Install

            ```sh
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/aphoristicartist/prog/releases/latest/download/install.sh | sh
            ```

            The installer requires GitHub CLI (`gh`) and refuses to extract a
            binary unless both its checksum and build attestation verify.

            ### Verify an artifact

            ```sh
            # Checksum
            sha256sum -c SHA256SUMS --ignore-missing
            # macOS equivalent
            shasum -a 256 -c SHA256SUMS
            # Build provenance (requires gh CLI)
            gh attestation verify <tarball> --owner aphoristicartist
            ```

            See `docs/release-notes.md` for supported platforms, known
            limitations, the schema/store-reset policy, and benchmark scope.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
